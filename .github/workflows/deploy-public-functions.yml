name: Deploy public Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/public-intelligence/**"
      - "supabase/functions/public-pages/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-public-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-public-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nifbuyoghesveotugday
    steps:
      - uses: actions/checkout@v4

      - name: Require deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not configured" >&2; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: 2.53.6

      - name: Deploy reader-facing functions
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy public-intelligence --project-ref "$PROJECT_REF"
          supabase functions deploy public-pages --project-ref "$PROJECT_REF"
