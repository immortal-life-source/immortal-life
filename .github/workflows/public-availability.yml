name: Public availability

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: Send a direct test email to hello@immortal.life
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: immortal-life-public-availability
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5

      - name: Check public routes from outside Vercel and Supabase
        id: availability
        continue-on-error: true
        run: >-
          node scripts/check-public-availability.mjs
          --origin https://www.immortal.life
          --attempts 3
          --retry-delay-ms 5000
          --timeout-ms 15000
          --output uptime-report.json

      - name: Retain the latest evidence
        if: steps.availability.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortal-life-availability-${{ github.run_id }}
          path: uptime-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Open, update, or resolve the availability incident
        id: incident
        if: always()
        uses: actions/github-script@v8
        env:
          CHECK_OUTCOME: ${{ steps.availability.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const title = 'Availability incident: immortal.life public routes';
            const report = JSON.parse(fs.readFileSync('uptime-report.json', 'utf8'));
            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'availability-incident', per_page: 100,
            });
            const incident = openIssues.find((issue) => issue.title === title);
            const table = report.results.map((item) => {
              const detail = item.final?.error || `HTTP ${item.final?.http_status ?? 'n/a'} · ${item.final?.duration_ms ?? 'n/a'} ms · cache ${item.final?.vercel_cache || 'unknown'} · source ${item.final?.source || 'standard'}`;
              return `| ${item.name} | ${item.status} | ${detail.replaceAll('|', '\\|')} |`;
            }).join('\n');
            const body = [
              `Automated external check at **${report.checked_at}**.`,
              '',
              '| Route | State | Evidence |',
              '| --- | --- | --- |',
              table,
              '',
              `[Open workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
            ].join('\n');

            if (process.env.CHECK_OUTCOME !== 'success') {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: 'availability-incident' });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name: 'availability-incident', color: 'cf2f72', description: 'Automated public availability incident' });
              }
              if (incident) {
                await github.rest.issues.createComment({ owner, repo, issue_number: incident.number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body, labels: ['availability-incident'] });
                core.setOutput('email_event', 'incident');
              }
              return;
            }

            if (incident) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: incident.number,
                body: `Recovered at **${report.checked_at}**. All ${report.total} monitored routes passed.\n\n[Open recovery check](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: incident.number, state: 'closed', state_reason: 'completed' });
              core.setOutput('email_event', 'recovered');
            }

      - name: Prepare and send the independent Postale alert
        if: steps.incident.outputs.email_event != '' || inputs.send_test_email == true
        env:
          ALERT_EVENT: ${{ inputs.send_test_email == true && 'test' || steps.incident.outputs.email_event }}
          ALERT_EMAIL_FROM: hello@immortal.life
          ALERT_EMAIL_TO: hello@immortal.life
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          POSTALE_SMTP_PASSWORD: ${{ secrets.POSTALE_SMTP_PASSWORD }}
        run: |
          if [ -z "$POSTALE_SMTP_PASSWORD" ]; then
            echo "::error::POSTALE_SMTP_PASSWORD is not configured; direct availability email could not be sent."
            exit 1
          fi
          node scripts/render-availability-email.mjs "$ALERT_EVENT" uptime-report.json uptime-email.txt
          curl --silent --show-error --fail \
            --url 'smtps://mail.postale.io:465' \
            --ssl-reqd \
            --user "hello@immortal.life:$POSTALE_SMTP_PASSWORD" \
            --mail-from 'hello@immortal.life' \
            --mail-rcpt 'hello@immortal.life' \
            --upload-file uptime-email.txt

      - name: Fail the workflow when the public check failed
        if: steps.availability.outcome != 'success'
        run: exit 1

